services:

  postgres:
    image: postgres:17
    container_name: ghostcheck-postgres

    environment:
      POSTGRES_DB: ghostcheck
      POSTGRES_USER: ghostcheck
      POSTGRES_PASSWORD: ghostcheck

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghostcheck -d ghostcheck"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: ghostcheck-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data


volumes:
  postgres_data:
  redis_data: