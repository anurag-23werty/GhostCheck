[project]
name = "ghostcheck-collector"
version = "0.1.0"
description = "Job collection service for GhostCheck"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic>=2.0",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
